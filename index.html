<h1>palantir-mail</h1>
<p>palantir-mail is a personal email client. It runs on its owner's own computer and lets them read, search, sort and act on their own Gmail accounts through the Gmail API.</p>
<p>It is a private tool for one person. It is not offered to the public, and there is no sign-up.</p>
